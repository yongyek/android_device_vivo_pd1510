name: Compile LineageOS 16.0

on:
  workflow_dispatch: # Membuat tombol manual untuk memulai build

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      contents: write

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Bersihkan Ruang Penyimpanan Server
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        df -h

    - name: Install Dependency & Tools Build
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Konfigurasi Git
      run: |
        git config --global user.name "GitHub Action Build"
        git config --global user.email "action@github.com"

    - name: Sinkronisasi Source Code LineageOS
      run: |
        mkdir -p ~/lineage
        cd ~/lineage
        repo init -u https://github.com -b lineage-16.0 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Menyusun Folder Device Tree, Kernel, & Vendor
      run: |
        cd ~/lineage
        # Memasukkan device tree Anda yang sudah diedit file config.xml-nya
        mkdir -p device/vivo/pd1510
        cp -r $GITHUB_WORKSPACE/* device/vivo/pd1510/
        
        # Mengunduh Kernel (Menggunakan kernel msm8916 yang kompatibel untuk Pie)
        git clone https://github.com -b pie kernel/vivo/pd1510 --depth=1
        
        # Mengunduh Vendor Blobs
        git clone https://github.com -b pie vendor/vivo/pd1510 --depth=1

    - name: Mulai Kompilasi ROM (Build)
      run: |
        cd ~/lineage
        source build/envsetup.sh
        lunch lineage_pd1510-userdebug
        mka bacon -j$(nproc --all)

    - name: Unggah Hasil ROM .zip ke GitHub Releases
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: ~/lineage/out/target/product/pd1510/lineage-16.0-*.zip
        tag_name: Build-${{ github.run_id }}
        name: LineageOS 16.0 Vivo Y51L
        body: |
          ROM LineageOS 16.0 Android Pie untuk Vivo Y51L (pd1510).
          Perbaikan bug: Slider kecerahan layar manual telah diaktifkan via overlay framework.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
